[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origami-engine-mjx"
version = "1.0.0"
description = "Dual-backend (MJX-JAX / MJX-Warp) MuJoCo MJX origami folding simulator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ihsan", email = "ihsanmuhammadkhoirul@students.unnes.ac.id" },
]
keywords = ["origami", "crease-pattern", "mujoco", "mjx", "jax", "warp", "folding-simulation", "gpu"]
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "jsonschema>=4.18",
    "matplotlib>=3.7",
    "mujoco>=3.0",
    "numpy>=1.24",
    "shapely>=2.0",
]

[project.optional-dependencies]
jax = [
    "mujoco-mjx>=3.0",
    "jax>=0.4",
]
warp = [
    "mujoco-warp>=3.0",
    "warp-lang>=1.0",
]
opt = [
    "pymoo>=0.6",
    "nevergrad>=0.10",
    "cma>=3.3",
    "evosax>=0.1",
]
rl = [
    "gymnasium>=0.29",
]
dev = [
    "pytest>=8",
    "pytest-cov>=4.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=3.8",
]
all = [
    "origami-engine-mjx[jax,warp,opt,rl,dev]",
]

[tool.setuptools.packages.find]
include = ["origami_engine_mjx*"]

[tool.setuptools.package-data]
origami_engine_mjx = ["schemas/*.json", "crease_patterns/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests_mjx"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
files = ["origami_engine_mjx"]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
warn_unused_ignores = false
