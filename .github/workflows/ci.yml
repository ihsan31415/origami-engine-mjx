name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff lint + format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run mypy type check
        run: |
          mypy origami_engine_mjx --config-file pyproject.toml

      - name: Check documentation links
        run: |
          python scripts/check_docs_links.py

      - name: Run pytest
        run: |
          pytest -q

  publish-to-pypi:
    needs: lint-and-test
    # Only publish real releases from main — never from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      # gh-action-pypi-publish is a Docker-container action; pre-pull its image
      # with retries so a transient ghcr.io pull failure does not fail the job
      # with "Unable to find image ... locally".
      - name: Pre-pull publisher image
        run: |
          for i in 1 2 3 4 5; do
            if docker pull ghcr.io/pypa/gh-action-pypi-publish:release-v1; then
              exit 0
            fi
            echo "pull attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::could not pull ghcr.io/pypa/gh-action-pypi-publish:release-v1"
          exit 1

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI rejects re-uploaded filenames; skip files already present so
          # re-running a failed job does not 400 on the wheel/sdist.
          skip-existing: true